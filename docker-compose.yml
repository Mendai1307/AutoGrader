# AutoGrader · 本项目为纯静态站点，不使用容器编排
# ============================================================================
# 本文件**不是**可用的 Compose 清单，仅为占位说明文件（原为空文件，已改为说明内容）。
# 文件内不含任何服务定义、镜像、端口或数据卷 —— 那是刻意为之。
#
# 事实陈述：
#   1. 交付物为 Next.js 静态导出产物 frontend/out/（HTML / CSS / JS / JSON）；
#   2. 运行时零后端、零数据库、零容器：任意静态文件服务器（或对象存储 + CDN）即可承载；
#   3. 项目内不存在 Dockerfile，也就不存在需要 docker compose up 的服务；
#   4. backend/ 目录不参与构建与部署，其中仅存放 Agent 的 prompt 规格文档。
#
# 本地预览产物（见 README「一、在线访问 → 本地运行」）：
#   cd frontend && npm run build && npm run preview
# 注意：构建默认 basePath = /AutoGrader（GitHub Pages 项目子路径），产物内部资源地址
#      被固化为 /AutoGrader/_next/...，因此必须挂在 /AutoGrader/ 子路径下访问。
#      `npm run preview` 会自动识别该前缀并打印正确地址，无需人工干预；
#      切勿用 `npx serve frontend/out` 直接挂根路径（资源会全部 404、页面白屏）。
#      若要按网站根路径部署，需以 NEXT_PUBLIC_BASE_PATH= 显式置空后重新构建。
#      该变量只影响静态资源前缀，与密钥、服务地址无关。
# ============================================================================
